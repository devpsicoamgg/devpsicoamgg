name: Foto Día
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Descargar imagen del día (Wikimedia)
        run: |
          mkdir -p assets
          OK=0
          UA="devpsicoamgg-readme-bot/1.0 (https://github.com/devpsicoamgg)"

          if command -v magick >/dev/null 2>&1; then
            CONV="magick"
          elif command -v convert >/dev/null 2>&1; then
            CONV="convert"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            CONV=$(command -v magick || command -v convert)
          fi
          echo "Usando: $CONV"

          for OFFSET in 0 1 2 3; do
            DIA=$(date -u -d "$OFFSET days ago" +%Y/%m/%d)
            FECHA=$(date -u -d "$OFFSET days ago" +%F)

            CODE=$(curl -sSL -A "$UA" --retry 3 --retry-delay 5 \
              -o feed.json -w "%{http_code}" \
              "https://api.wikimedia.org/feed/v1/wikipedia/en/featured/${DIA}" || true)
            echo "Fecha $FECHA -> HTTP $CODE"
            [ "$CODE" = "200" ] || continue

            THUMB=$(node -e "const i=require('./feed.json').image||{};console.log((i.thumbnail&&i.thumbnail.source)||'')")
            ORIG=$(node -e "const i=require('./feed.json').image||{};console.log((i.image&&i.image.source)||'')")

            C1=$(echo "$THUMB" | sed -E 's#\?.*$##; s#/[0-9]+px-#/960px-#')
            C2=$(echo "$THUMB" | sed -E 's#\?.*$##')
            C3=$(echo "$ORIG"  | sed -E 's#\?.*$##')

            for URL in "$C1" "$C2" "$C3"; do
              [ -z "$URL" ] && continue
              echo "Descargando: $URL"
              IMG_CODE=$(curl -sSL -A "$UA" --retry 3 --retry-delay 5 \
                -o assets/img.tmp -w "%{http_code}" "$URL" || true)
              echo "Código HTTP de la imagen: $IMG_CODE"

              if [ "$IMG_CODE" = "200" ] && file assets/img.tmp | grep -qi "image" \
                 && [ "$(stat -c%s assets/img.tmp)" -gt 20000 ]; then

                if $CONV "assets/img.tmp[0]" -resize "960x>" -background white -flatten \
                     -quality 85 assets/apod.jpg 2>/dev/null; then
                  node -e "const i=require('./feed.json').image||{};const t=s=>(s&&s.text)||'';require('fs').writeFileSync('/tmp/meta.json',JSON.stringify({desc:t(i.description),artist:t(i.artist),title:i.title||''}))"
                  echo "FECHA_APOD=$FECHA" >> $GITHUB_ENV
                  OK=1
                  break 2
                else
                  echo "Conversión fallida, se prueba otra fuente"
                  continue
                fi
              fi
            done
          done

          rm -f assets/img.tmp feed.json

          if [ "$OK" = "0" ]; then
            echo "::error::No se pudo obtener una imagen válida."
            exit 1
          else
            file assets/apod.jpg
          fi

      - name: Actualizar README (fecha, imagen, descripción y chiste)
        if: env.FECHA_APOD != ''
        run: |
          sed -i -E "s#assets/apod\.jpg(\?v=[0-9-]*)?#assets/apod.jpg?v=${FECHA_APOD}#" README.md
          node <<'EOF'
          const fs = require('fs');
          const meta = JSON.parse(fs.readFileSync('/tmp/meta.json', 'utf8'));
          const fecha = process.env.FECHA_APOD;

          const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const clean = s => (s || '').replace(/\s+/g, ' ').trim();

          // Descripción real, recortada en una palabra completa
          let desc = clean(meta.desc);
          if (!desc) desc = clean(meta.title).replace(/^File:/i, '').replace(/\.\w+$/, '').replace(/_/g, ' ');
          if (!desc) desc = 'A mystery picture. Even my psychology degree has no comment.';
          if (desc.length > 240) desc = desc.slice(0, 240).replace(/\s+\S*$/, '') + '…';

          let credit = clean(meta.artist).slice(0, 80) || 'Wikimedia Commons';

          // Chiste rotativo según el día del año
          const jokes = [
            "No psychoanalysis here, but this picture says a lot about all of us.",
            "Compiled with zero warnings. Unlike my last commit.",
            "If this image were code, it would be perfectly indented.",
            "My dogs and my plants have already approved this one.",
            "Freud would see something deeper. I just see good pixels.",
            "Merged into main without conflicts. A small miracle.",
            "Mind reader turned code reader, now picture reader.",
            "Zero bugs found. I checked twice, then I checked my ego.",
            "Today's therapy session: stare at this and breathe.",
            "Deployed to production on a Friday and it still looks great."
          ];
          const d = new Date(fecha + 'T00:00:00Z');
          const dia = Math.floor((d - new Date(Date.UTC(d.getUTCFullYear(), 0, 0))) / 86400000);
          const joke = jokes[dia % jokes.length];

          const reemplazar = (txt, nombre, valor) =>
            txt.replace(
              new RegExp(`<!-- ${nombre}-START -->[\\s\\S]*?<!-- ${nombre}-END -->`, 'g'),
              () => `<!-- ${nombre}-START -->${valor}<!-- ${nombre}-END -->`
            );

          let readme = fs.readFileSync('README.md', 'utf8');
          readme = reemplazar(readme, 'APOD-DATE', fecha);
          readme = reemplazar(readme, 'APOD-DESC', esc(desc));
          readme = reemplazar(readme, 'APOD-JOKE', esc(joke));
          readme = reemplazar(readme, 'APOD-CREDIT', esc(credit));
          fs.writeFileSync('README.md', readme);
          EOF

      - name: Commit y push
        if: env.FECHA_APOD != ''
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/apod.jpg README.md
          git diff --cached --quiet || git commit -m "Actualizar imagen del día - ${FECHA_APOD}"
          git pull --rebase origin main
          git push
