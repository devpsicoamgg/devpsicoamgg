name: Foto Día NASA
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar foto APOD
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          mkdir -p assets
          curl -fsS "https://api.nasa.gov/planetary/apod?api_key=$NASA_API_KEY&thumbs=true" > apod.json

          TIPO=$(node -e "console.log(require('./apod.json').media_type)")
          FECHA=$(node -e "console.log(require('./apod.json').date)")

          if [ "$TIPO" = "image" ]; then
            IMG_URL=$(node -e "const a=require('./apod.json');console.log(a.hdurl||a.url)")
          else
            IMG_URL=$(node -e "console.log(require('./apod.json').thumbnail_url || '')")
          fi

          if [ -z "$IMG_URL" ]; then
            echo "Hoy el APOD es un video sin miniatura. Se conserva la foto anterior."
            exit 0
          fi

          echo "Descargando: $IMG_URL"
          curl -fsSL "$IMG_URL" -o assets/apod.jpg
          file assets/apod.jpg
          echo "FECHA_APOD=$FECHA" >> $GITHUB_ENV

      - name: Actualizar fecha en README
        if: env.FECHA_APOD != ''
        run: |
          sed -i "s|<!-- APOD-DATE-START -->.*<!-- APOD-DATE-END -->|<!-- APOD-DATE-START -->${FECHA_APOD}<!-- APOD-DATE-END -->|" README.md

      - name: Commit y push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/apod.jpg README.md
          git diff --cached --quiet || git commit -m "Actualizar foto del día NASA - ${FECHA_APOD:-sin-cambios}"
          git pull --rebase origin main
          git push
