name: Foto Día NASA
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar foto APOD
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          mkdir -p assets

          if [ -z "$NASA_API_KEY" ]; then
            echo "::warning::NASA_API_KEY está vacío. Se usa DEMO_KEY (límite bajo)."
            NASA_API_KEY="DEMO_KEY"
          fi

          # 1. Llamada a la API con reintentos y código HTTP visible
          HTTP_CODE=$(curl -sS -L \
            --retry 5 --retry-delay 10 --retry-all-errors \
            -o apod.json -w "%{http_code}" \
            "https://api.nasa.gov/planetary/apod?api_key=${NASA_API_KEY}&thumbs=true")

          echo "Código HTTP de la API: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::La API de NASA respondió $HTTP_CODE"
            cat apod.json
            exit 1
          fi

          TIPO=$(node -e "console.log(require('./apod.json').media_type)")
          FECHA=$(node -e "console.log(require('./apod.json').date)")
          URL_HD=$(node -e "console.log(require('./apod.json').hdurl || '')")
          URL_STD=$(node -e "console.log(require('./apod.json').url || '')")
          URL_THUMB=$(node -e "console.log(require('./apod.json').thumbnail_url || '')")

          echo "Tipo: $TIPO | Fecha: $FECHA"

          # 2. Elegir candidatos según el tipo de contenido
          if [ "$TIPO" = "image" ]; then
            CANDIDATOS="$URL_HD $URL_STD"
          else
            CANDIDATOS="$URL_THUMB"
          fi

          # 3. Intentar descargar cada candidato hasta que uno funcione
          OK=0
          for URL in $CANDIDATOS; do
            [ -z "$URL" ] && continue
            echo "Descargando: $URL"
            CODE=$(curl -sSL \
              --retry 3 --retry-delay 5 \
              -A "Mozilla/5.0 (compatible; github-actions-apod)" \
              -o assets/apod.tmp -w "%{http_code}" "$URL")
            echo "Código HTTP de la imagen: $CODE"
            if [ "$CODE" = "200" ] && file assets/apod.tmp | grep -qi "image"; then
              mv assets/apod.tmp assets/apod.jpg
              OK=1
              break
            fi
          done

          rm -f assets/apod.tmp

          if [ "$OK" = "0" ]; then
            echo "::warning::No se pudo obtener imagen hoy (video sin miniatura o descarga fallida). Se conserva la foto anterior."
            exit 0
          fi

          file assets/apod.jpg
          echo "FECHA_APOD=$FECHA" >> $GITHUB_ENV

      - name: Actualizar fecha en README
        if: env.FECHA_APOD != ''
        run: |
          sed -i "s|<!-- APOD-DATE-START -->.*<!-- APOD-DATE-END -->|<!-- APOD-DATE-START -->${FECHA_APOD}<!-- APOD-DATE-END -->|" README.md

      - name: Commit y push
        if: env.FECHA_APOD != ''
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/apod.jpg README.md
          git diff --cached --quiet || git commit -m "Actualizar foto del día NASA - ${FECHA_APOD}"
          git pull --rebase origin main
          git push
