name: Foto Día
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Descargar imagen del día (Wikimedia)
        run: |
          mkdir -p assets
          OK=0
          UA="devpsicoamgg-readme-bot/1.0 (https://github.com/devpsicoamgg)"

          for OFFSET in 0 1 2 3; do
            DIA=$(date -u -d "$OFFSET days ago" +%Y/%m/%d)
            FECHA=$(date -u -d "$OFFSET days ago" +%F)

            CODE=$(curl -sSL -A "$UA" --retry 3 --retry-delay 5 \
              -o feed.json -w "%{http_code}" \
              "https://api.wikimedia.org/feed/v1/wikipedia/en/featured/${DIA}" || true)
            echo "Fecha $FECHA -> HTTP $CODE"
            [ "$CODE" = "200" ] || continue

            URL=$(node -e "const j=require('./feed.json');const i=j.image||{};console.log((i.thumbnail&&i.thumbnail.source)||(i.image&&i.image.source)||'')")
            [ -z "$URL" ] && { echo "Sin imagen ese día"; continue; }

            URL=$(echo "$URL" | sed -E 's#/[0-9]+px-#/1200px-#')
            echo "Descargando: $URL"

            IMG_CODE=$(curl -sSL -A "$UA" --retry 3 --retry-delay 5 \
              -o assets/img.tmp -w "%{http_code}" "$URL" || true)
            echo "Código HTTP de la imagen: $IMG_CODE"

            if [ "$IMG_CODE" = "200" ] && file assets/img.tmp | grep -qi "image" \
               && [ "$(stat -c%s assets/img.tmp)" -gt 20000 ]; then
              mv assets/img.tmp assets/apod.jpg
              echo "FECHA_APOD=$FECHA" >> $GITHUB_ENV
              OK=1
              break
            fi
          done

          rm -f assets/img.tmp feed.json

          if [ "$OK" = "0" ]; then
            echo "::error::No se pudo obtener una imagen válida."
            exit 1
          else
            file assets/apod.jpg
          fi

      - name: Actualizar fecha en README
        if: env.FECHA_APOD != ''
        run: |
          sed -i "s|<!-- APOD-DATE-START -->.*<!-- APOD-DATE-END -->|<!-- APOD-DATE-START -->${FECHA_APOD}<!-- APOD-DATE-END -->|" README.md

      - name: Commit y push
        if: env.FECHA_APOD != ''
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/apod.jpg README.md
          git diff --cached --quiet || git commit -m "Actualizar imagen del día - ${FECHA_APOD}"
          git pull --rebase origin main
          git push
