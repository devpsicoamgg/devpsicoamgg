name: Foto Día NASA
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Descargar foto APOD
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          mkdir -p assets
          KEY="${NASA_API_KEY:-DEMO_KEY}"
          OK=0

          for OFFSET in 0 1 2 3 4 5 6; do
            DIA=$(date -u -d "$OFFSET days ago" +%F)

            CODE=$(curl -sS -L \
              --retry 3 --retry-delay 10 \
              -o apod.json -w "%{http_code}" \
              "https://api.nasa.gov/planetary/apod?api_key=${KEY}&date=${DIA}" || true)
            echo "Fecha $DIA -> HTTP $CODE"
            [ "$CODE" = "200" ] || continue

            echo "Respuesta: $(cat apod.json)"

            TIPO=$(node -e "console.log(require('./apod.json').media_type || '')")
            FECHA=$(node -e "console.log(require('./apod.json').date || '')")
            URL_HD=$(node -e "console.log(require('./apod.json').hdurl || '')")
            URL_STD=$(node -e "console.log(require('./apod.json').url || '')")

            if [ "$TIPO" != "image" ]; then
              echo "El APOD de $DIA es '$TIPO', se prueba el día anterior."
              continue
            fi

            for URL in $URL_HD $URL_STD; do
              [ -z "$URL" ] && continue

              if echo "$URL" | grep -qiE "logo|/themes/|/assets/images/"; then
                echo "URL descartada (parece un logo): $URL"
                continue
              fi

              echo "Descargando: $URL"
              IMG_CODE=$(curl -sSL \
                --retry 3 --retry-delay 5 \
                -A "Mozilla/5.0 (compatible; github-actions-apod)" \
                -o assets/apod.tmp -w "%{http_code}" "$URL" || true)
              echo "Código HTTP de la imagen: $IMG_CODE"

              if [ "$IMG_CODE" = "200" ] && file assets/apod.tmp | grep -qi "image"; then
                TAM=$(stat -c%s assets/apod.tmp)
                if [ "$TAM" -lt 50000 ]; then
                  echo "Imagen descartada (solo $TAM bytes, muy pequeña)."
                  continue
                fi
                mv assets/apod.tmp assets/apod.jpg
                echo "FECHA_APOD=$FECHA" >> $GITHUB_ENV
                OK=1
                break 2
              fi
            done
          done

          rm -f assets/apod.tmp

          if [ "$OK" = "0" ]; then
            echo "::error::No se pudo obtener una foto válida del APOD en los últimos 7 días."
            exit 1
          else
            file assets/apod.jpg
          fi

      - name: Actualizar fecha en README
        if: env.FECHA_APOD != ''
        run: |
          sed -i "s|<!-- APOD-DATE-START -->.*<!-- APOD-DATE-END -->|<!-- APOD-DATE-START -->${FECHA_APOD}<!-- APOD-DATE-END -->|" README.md

      - name: Commit y push
        if: env.FECHA_APOD != ''
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/apod.jpg README.md
          git diff --cached --quiet || git commit -m "Actualizar foto del día NASA - ${FECHA_APOD}"
          git pull --rebase origin main
          git push
          git pull --rebase origin main
          git push
